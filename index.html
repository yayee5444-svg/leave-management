<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อัปโหลดเอกสารลา</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 12px; }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 28px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    select {
      width: 100%;
      padding: 12px 10px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      color: #2d3748;
      background: #f7fafc;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      text-align: center;
    }
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
      background: white;
    }

    .upload-zone {
      border: 2.5px dashed #cbd5e0;
      border-radius: 16px;
      padding: 32px 20px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f7fafc;
      position: relative;
      margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #667eea;
      background: #ebf4ff;
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .upload-zone .up-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .upload-zone p { color: #718096; font-size: 0.9rem; line-height: 1.5; }
    .upload-zone p strong { color: #667eea; }

    .file-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .chip {
      background: #ebf4ff;
      color: #667eea;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip button {
      background: none; border: none;
      cursor: pointer; color: #667eea;
      font-size: 1rem; line-height: 1; padding: 0;
    }

    .drive-link {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f0fff4;
      border: 1.5px solid #9ae6b4;
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: #276749;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .drive-link:hover { background: #c6f6d5; }
    .drive-link.show { display: flex; }

    .btn-upload {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(102,126,234,0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-upload:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.45);
    }
    .btn-upload:disabled { opacity: 0.45; cursor: not-allowed; }

    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #48bb78;
      color: white;
      padding: 13px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: #fc8181; }

    @media(max-width: 460px) {
      .card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">📋</div>
  <h1>อัปโหลดเอกสารการลา</h1>

  <!-- Date pickers -->
  <div class="date-row">
    <select id="sel-year" onchange="onYearChange()">
      <option value="">ปี</option>
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
    <select id="sel-month" onchange="onMonthChange()" disabled>
      <option value="">เดือน</option>
    </select>
    <select id="sel-day" disabled>
      <option value="">วัน</option>
    </select>
  </div>

  <!-- Drive folder link -->
  <a class="drive-link" id="drive-link" href="#" target="_blank">
    🗂️ <span id="drive-label">เปิดโฟลเดอร์ Google Drive</span>
  </a>

  <!-- Upload zone -->
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" />
    <div class="up-icon">📁</div>
    <p><strong>คลิกหรือลากไฟล์มาวาง</strong><br/>PDF, รูปภาพ, Word</p>
  </div>

  <!-- File chips -->
  <div class="file-chips" id="file-chips"></div>

  <!-- Upload button -->
  <button class="btn-upload" id="btn-upload" disabled onclick="doUpload()">
    ⬆️ อัปโหลดเอกสาร
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const DRIVE_BASE = "https://drive.google.com/drive/folders/";

const MONTHS_DATA = {
  "ม.ค.": 31, "ก.พ.": 28, "มี.ค.": 31, "เม.ย.": 30,
  "พ.ค.": 31, "มิ.ย.": 30, "ก.ค.": 31, "ส.ค.": 31,
  "ก.ย.": 30, "ต.ค.": 31, "พ.ย.": 30, "ธ.ค.": 31
};

const AVAILABLE = {
  "2026": ["พ.ย.", "ธ.ค."],
  "2027": ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."]
};

const FOLDER_IDS = {
  "2026": {
    "พ.ย.": "1kRa2l-9aijBatCAPGdbWc3kwOPsyqv3A",
    "ธ.ค.": "1R2YWjByp92iagRVm-4x7rotJoOcCC8RC"
  },
  "2027": {
    "ม.ค.":  "1DWumZ8ACbz-puujj0VMcmnnE0kYRz_Ck",
    "ก.พ.":  "1YP18ZOSlfgUgruW9kpkSYjLX4h3i0x-M",
    "มี.ค.": "1x4LIEh6DivHnDA5_E1CKwOUpMb6P1wLF",
    "เม.ย.": "1meKKNO8IHflPzp29Iy2vz_Vyq6aYdbHK",
    "พ.ค.":  "1IsnT43FelJcXZ5V-_EIS6qIzrqBebGGx",
    "มิ.ย.": "1zoLaXQPIoquOSj9qCyBgYTqSpBlGUFRY",
    "ก.ค.":  "15mmd-OFe_6FbYkRvr9O9siwfMC8lxSK7",
    "ส.ค.":  "1WCAIA1xn9Ib9h345tZ3fDvcx8kg9ra4j",
    "ก.ย.":  "1Y-hKqSyxqLGrCflrJZ0G-Jn4CIfQknay",
    "ต.ค.":  "1rQulCNkdrG8l_LSQO6qSHR_mTzB-55rO",
    "พ.ย.":  "1_9utMOqAomk_mkocR4ulWrIjsKZGzyg4",
    "ธ.ค.":  "1DBOc15Uw5DJ8Zte9SQDHu4gMK-M_0lwy"
  }
};

let files = [];

// File input
document.getElementById("file-input").addEventListener("change", e => addFiles(e.target.files));

// Drag & drop
const zone = document.getElementById("upload-zone");
zone.addEventListener("dragover",  e => { e.preventDefault(); zone.classList.add("drag-over"); });
zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
zone.addEventListener("drop", e => {
  e.preventDefault();
  zone.classList.remove("drag-over");
  addFiles(e.dataTransfer.files);
});

function addFiles(list) {
  Array.from(list).forEach(f => {
    if (!files.find(x => x.name === f.name)) files.push(f);
  });
  renderChips();
  checkReady();
}

function removeFile(i) {
  files.splice(i, 1);
  renderChips();
  checkReady();
}

function renderChips() {
  const c = document.getElementById("file-chips");
  c.innerHTML = files.map((f, i) =>
    `<div class="chip">📄 ${f.name.length > 18 ? f.name.slice(0,18)+'…' : f.name}
     <button onclick="removeFile(${i})">×</button></div>`
  ).join("");
}

function onYearChange() {
  const year = document.getElementById("sel-year").value;
  const ms = document.getElementById("sel-month");
  const ds = document.getElementById("sel-day");
  ms.innerHTML = '<option value="">เดือน</option>';
  ds.innerHTML = '<option value="">วัน</option>';
  ms.disabled = !year;
  ds.disabled = true;
  if (year) {
    AVAILABLE[year].forEach(m => {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      ms.appendChild(o);
    });
  }
  updateDriveLink();
  checkReady();
}

function onMonthChange() {
  const month = document.getElementById("sel-month").value;
  const ds = document.getElementById("sel-day");
  ds.innerHTML = '<option value="">วัน</option>';
  ds.disabled = !month;
  if (month) {
    for (let d = 1; d <= MONTHS_DATA[month]; d++) {
      const o = document.createElement("option");
      o.value = d; o.textContent = d;
      ds.appendChild(o);
    }
  }
  updateDriveLink();
  checkReady();
}

document.getElementById("sel-day").addEventListener("change", checkReady);

function updateDriveLink() {
  const year  = document.getElementById("sel-year").value;
  const month = document.getElementById("sel-month").value;
  const link  = document.getElementById("drive-link");
  const label = document.getElementById("drive-label");
  if (year && month && FOLDER_IDS[year]?.[month]) {
    link.href = DRIVE_BASE + FOLDER_IDS[year][month];
    label.textContent = `โฟลเดอร์ ${year} / ${month}`;
    link.classList.add("show");
  } else {
    link.classList.remove("show");
  }
}

function checkReady() {
  const year  = document.getElementById("sel-year").value;
  const month = document.getElementById("sel-month").value;
  const day   = document.getElementById("sel-day").value;
  document.getElementById("btn-upload").disabled = !(year && month && day && files.length);
}

function doUpload() {
  const year  = document.getElementById("sel-year").value;
  const month = document.getElementById("sel-month").value;
  const day   = document.getElementById("sel-day").value;
  const fid   = FOLDER_IDS[year]?.[month];

  if (fid) {
    window.open(DRIVE_BASE + fid, "_blank");
  }
  showToast(`✅ เปิดโฟลเดอร์ ${day} ${month} ${year} แล้ว — วางไฟล์ใน Drive ได้เลย!`);
}

function showToast(msg, err = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (err ? " error" : "") + " show";
  setTimeout(() => t.className = "toast", 3500);
}
</script>
</body>
</html>
