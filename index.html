<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อัปโหลดเอกสารลา</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .icon { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; font-weight: 700; color: #2d3748; margin-bottom: 28px; }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    select {
      width: 100%;
      padding: 12px 10px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: inherit;
      color: #2d3748;
      background: #f7fafc;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
      background: white;
    }

    .upload-zone {
      border: 2.5px dashed #cbd5e0;
      border-radius: 16px;
      padding: 32px 20px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f7fafc;
      position: relative;
      margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: #667eea;
      background: #ebf4ff;
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .upload-zone .up-icon { font-size: 2.2rem; margin-bottom: 8px; }
    .upload-zone p { color: #718096; font-size: 0.9rem; line-height: 1.5; }
    .upload-zone p strong { color: #667eea; }

    .file-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .chip {
      background: #ebf4ff;
      color: #667eea;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chip button {
      background: none; border: none;
      cursor: pointer; color: #667eea;
      font-size: 1rem; line-height: 1; padding: 0;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-upload {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(102,126,234,0.35);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-upload:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.45);
    }
    .btn-upload:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-camera {
      width: 100%;
      padding: 14px;
      border: 2.5px solid #667eea;
      border-radius: 14px;
      background: white;
      color: #667eea;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-camera input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .btn-camera:hover { background: #ebf4ff; transform: translateY(-2px); }

    /* Progress */
    .progress-wrap {
      display: none;
      margin-top: 18px;
      text-align: left;
    }
    .progress-wrap.show { display: block; }
    .progress-label {
      font-size: 0.85rem;
      color: #4a5568;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .progress-bar-bg {
      background: #e2e8f0;
      border-radius: 20px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #667eea, #764ba2);
      height: 100%;
      border-radius: 20px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-items {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #718096;
      max-height: 100px;
      overflow-y: auto;
    }
    .progress-item { padding: 2px 0; }
    .progress-item.ok   { color: #38a169; }
    .progress-item.err  { color: #e53e3e; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #48bb78;
      color: white;
      padding: 13px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: #fc8181; }

    @media(max-width: 460px) {
      .card { padding: 28px 16px; }
    }
  </style>
</head>
<body>

  <div class="icon"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAK4AAACMCAYAAADlaJLTAAAJrUlEQVR4AeydeWgUVxzHf0aTTeKFNbSJMW2kNWnUesT+IQhKWwUFI/FAqygYPCiKWqPifQTUelQMKFJblVbB4w+PFKlBtEiD1kKjqNUYUaJoalKbotaYy7idt9nM7mZ3Z3ZfZybz3nzDvp037/i93/t+P9mNuztrjBs/UEBABWIIP1BAQAUAroCmIWUigAsKhFQA4AppG5IGuGDAZAXMCQ9wzdEVUU1WAOCaLDDCm6MAwDVHV0Q1WQGAa7LACG+OAgDXHF0R1WQFAK7JAosUXqRcAa5IbiFXVQGAq0qBikgKAFyR3EKuqgIAV5UCFZEUALgiuYVcVQUAriqFSBXkCnDBgJAKAFwhbUPSABcMCKkAwBXSNiQNcMGAkAoAXJNtQ3hzFAC45uiKqCYrAHBNFhjhzVEA4JqjK6KarADANVlghDdHAYBrjq6IarICAFcVGBWRFAC4IrmFXFUFAK4qBSoiKQBwRXILuaoKAFxVClREUgDgiuQWclUVEBJcNXtUHKsAwHWs9WJvHOCK7Z9jswe4jrVe7I0DXLH9c2z2ANex1ou9cZPBFVscZG9fBQCufb1BZhoKAFwNcdBlXwUArn29QWYaCgBcDXHQZV8FAK59vUFmGgqo4GqMQRcUsJ0CANcCS65du0abN2+mOXPm0NixYyk3N5cWLFhAe/bsoaqqKgsykG8JgGuip0ePHqW+fftSdnY2rV27lg4cOEDFxcVUVFREe/fupYULF1JKSgqNHj2abt++bWIm8oUGuCZ4WldX53lknT59Ot27d093hfPnz1P//v2poKBAdywGtCgAcFt0MOze7XbTlClTPI+s0QbduHEj7d69O9ppjhwPcEPYXl9fTyUlJbRr1y5iMEVTpk2bRmfOnAmK6nK5aPDgwcT6c3JyKCMjI2gMa1i0aBGtWLEi6nUPHjxI169fZyHsWgzNC+C2kXPJkiWUkJBAI0aMoPz8fM/TN3sKj7QcP368TUTyxLl06RLt37+fli5dShs2bKAjR454HpUnTJgQNH779u1Rrzt79mzPL0ZycrLn7+egoJI1AFw/Q4cPH06FhYV+Lf+/um/fPmJ/64aKlJSURGvWrKF58+aF6uZqq66u9rxisXLlSq75okwCuF6n2NPz5cuXvWfGHObOnUtDhw7VDcbAHTJkiO64aAZs27aNzp07F80UocYCXMWumpoaYk/PSjXglprUjQZ90IurfJyVTnl5swLisZPmuhf05nUjqwaUZUsWc63Tml/XRFdAPHayatUqdpCyAFzF1lCPTNsXjKPv102jrxfm8JVVcyguLhCml2Xn6MXV4/T8tx+o4c+bysq+W2a/AbTzy4l8ayk5nvxqFs0cE/jofvXqVXr69KlvEYlqAFcx88GDB8q979a/zzs0JCPV1xCi1qnr29SpW0r40r1XwKzml39T0z8P1ba6x9fVemsl9q33wsdT1uqY0L11aMjj56MGB7VXVFQEtek2CDAA4ComNTQ0KPe+W2J8nO8kTK1z5qfU9aNxYUt86sCAmR1cXYg6dKTWn5j4bq1V9dg545Ow8dhacSkD1LGhKnGxncilFP++2tpa/1Np6gA3Qiu7Jb9P/iWmY2yEM1uGxcTGU5cPP/M8osb2SKPOfUe2dERxH5fYPSCHLklpUcyWayjAjcDP2ISulDX2i4DC2iKYGjCE/SnAHjm79BtDek/7ARO9Jz3e7ReQQ5/hk709zjsAXOd5LsWOAa4UNjpvEwCX03P2YRrOqdzTQqzJHUv0iQCX00H2QRr2uQQrS2lpKWe28k0DuPJ56ogdAVxOmydNmkQzZ860tAwbNowzW/mmAVxOT1NTUyk9Pd3S0rNnT85s5ZsGcOXz1BE7ArhW2Yx1DFUA4BoqJ4JZpQDAtUpprGOoAgCXU86T   <h1>อัปโหลดเอกสารการลา</h1>

  <!-- Date pickers -->
  <div class="date-row">
    <select id="sel-year" onchange="onYearChange()">
      <option value="">ปี</option>
      <option value="2026">2026</option>
      <option value="2027">2027</option>
    </select>
    <select id="sel-month" onchange="onMonthChange()" disabled>
      <option value="">เดือน</option>
    </select>
    <select id="sel-day" onchange="checkReady()" disabled>
      <option value="">วัน</option>
    </select>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,image/*,application/pdf" />
    <div class="up-icon">📁</div>
    <p><strong>คลิกหรือลากไฟล์มาวาง</strong><br/>PDF และรูปภาพเท่านั้น</p>
  </div>

  <!-- File chips -->
  <div class="file-chips" id="file-chips"></div>

  <!-- Buttons -->
  <div class="btn-row">
    <div class="btn-camera" id="btn-camera">
      📷 ถ่ายรูป
      <input type="file" id="camera-input" accept="image/*" multiple />
    </div>
    <button class="btn-upload" id="btn-upload" disabled onclick="doUpload()">
      ⬆️ อัปโหลด
    </button>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-label" id="progress-label">กำลังอัปโหลด...</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <div class="progress-items" id="progress-items"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // === CONFIG ===
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-xTcewhDAfFxyUTJwyU80mYrhX_n4ctq1bJsX25SEmcUTbLKxEPJDUJ1-7r28dY4DuA/exec";

  const MONTHS_DATA = {
    "ม.ค.": 31, "ก.พ.": 28, "มี.ค.": 31, "เม.ย.": 30,
    "พ.ค.": 31, "มิ.ย.": 30, "ก.ค.": 31, "ส.ค.": 31,
    "ก.ย.": 30, "ต.ค.": 31, "พ.ย.": 30, "ธ.ค.": 31
  };

  const AVAILABLE = {
    "2026": ["พ.ย.", "ธ.ค."],
    "2027": ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."]
  };

  const FOLDER_IDS = {
    "2026": {
      "พ.ย.": "1kRa2l-9aijBatCAPGdbWc3kwOPsyqv3A",
      "ธ.ค.": "1R2YWjByp92iagRVm-4x7rotJoOcCC8RC"
    },
    "2027": {
      "ม.ค.":  "1DWumZ8ACbz-puujj0VMcmnnE0kYRz_Ck",
      "ก.พ.":  "1YP18ZOSlfgUgruW9kpkSYjLX4h3i0x-M",
      "มี.ค.": "1x4LIEh6DivHnDA5_E1CKwOUpMb6P1wLF",
      "เม.ย.": "1meKKNO8IHflPzp29Iy2vz_Vyq6aYdbHK",
      "พ.ค.":  "1IsnT43FelJcXZ5V-_EIS6qIzrqBebGGx",
      "มิ.ย.": "1zoLaXQPIoquOSj9qCyBgYTqSpBlGUFRY",
      "ก.ค.":  "15mmd-OFe_6FbYkRvr9O9siwfMC8lxSK7",
      "ส.ค.":  "1WCAIA1xn9Ib9h345tZ3fDvcx8kg9ra4j",
      "ก.ย.":  "1Y-hKqSyxqLGrCflrJZ0G-Jn4CIfQknay",
      "ต.ค.":  "1rQulCNkdrG8l_LSQO6qSHR_mTzB-55rO",
      "พ.ย.":  "1_9utMOqAomk_mkocR4ulWrIjsKZGzyg4",
      "ธ.ค.":  "1DBOc15Uw5DJ8Zte9SQDHu4gMK-M_0lwy"
    }
  };

  let files = [];

  // === INIT ===
  document.getElementById("file-input").addEventListener("change", e => addFiles(e.target.files));
  document.getElementById("camera-input").addEventListener("change", e => addFiles(e.target.files));

  const zone = document.getElementById("upload-zone");
  zone.addEventListener("dragover",  e => { e.preventDefault(); zone.classList.add("drag-over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("drag-over");
    addFiles(e.dataTransfer.files);
  });

  // === FILES ===
  function addFiles(list) {
    const allowed = ["application/pdf", "image/jpeg", "image/png", "image/gif", "image/webp", "image/heic", "image/heif"];
    let rejected = [];
    Array.from(list).forEach(f => {
      const isImage = f.type.startsWith("image/");
      const isPdf   = f.type === "application/pdf";
      if (!isImage && !isPdf) {
        rejected.push(f.name);
        return;
      }
      if (!files.find(x => x.name === f.name)) files.push(f);
    });
    if (rejected.length) showToast(`❌ ไฟล์ที่ไม่รองรับ: ${rejected.join(", ")}`, true);
    renderChips();
    checkReady();
  }

  function removeFile(i) {
    files.splice(i, 1);
    renderChips();
    checkReady();
  }

  function renderChips() {
    const c = document.getElementById("file-chips");
    c.innerHTML = files.map((f, i) =>
      `<div class="chip">📄 ${f.name.length > 18 ? f.name.slice(0,18)+'…' : f.name}
       <button onclick="removeFile(${i})">×</button></div>`
    ).join("");
  }

  // === DROPDOWNS ===
  function onYearChange() {
    const year = document.getElementById("sel-year").value;
    const ms = document.getElementById("sel-month");
    const ds = document.getElementById("sel-day");
    ms.innerHTML = '<option value="">เดือน</option>';
    ds.innerHTML = '<option value="">วัน</option>';
    ms.disabled = !year;
    ds.disabled = true;
    if (year) {
      AVAILABLE[year].forEach(m => {
        const o = document.createElement("option");
        o.value = m; o.textContent = m;
        ms.appendChild(o);
      });
    }
    checkReady();
  }

  function onMonthChange() {
    const month = document.getElementById("sel-month").value;
    const ds = document.getElementById("sel-day");
    ds.innerHTML = '<option value="">วัน</option>';
    ds.disabled = !month;
    if (month) {
      for (let d = 1; d <= MONTHS_DATA[month]; d++) {
        const o = document.createElement("option");
        o.value = d; o.textContent = d;
        ds.appendChild(o);
      }
    }
    checkReady();
  }

  function checkReady() {
    const year  = document.getElementById("sel-year").value;
    const month = document.getElementById("sel-month").value;
    const day   = document.getElementById("sel-day").value;
    document.getElementById("btn-upload").disabled = !(year && month && day && files.length > 0);
  }

  // === UPLOAD ===
  async function doUpload() {
    const year  = document.getElementById("sel-year").value;
    const month = document.getElementById("sel-month").value;
    const day   = document.getElementById("sel-day").value;
    const folderId = FOLDER_IDS[year]?.[month];

    if (!folderId) { showToast("ไม่พบโฟลเดอร์ใน Drive", true); return; }

    // Disable button, show progress
    document.getElementById("btn-upload").disabled = true;
    const wrap = document.getElementById("progress-wrap");
    const bar  = document.getElementById("progress-bar");
    const itemsDiv = document.getElementById("progress-items");
    const label = document.getElementById("progress-label");
    wrap.classList.add("show");
    itemsDiv.innerHTML = "";
    bar.style.width = "0%";

    let done = 0;
    const total = files.length;

    for (const file of files) {
      label.textContent = `กำลังอัปโหลด ${file.name}...`;
      try {
        const base64 = await toBase64(file);
        const payload = {
          folderId: folderId,
          day: day,
          fileName: file.name,
          fileContent: base64,
          mimeType: file.type || "application/octet-stream"
        };

        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        done++;
        bar.style.width = (done / total * 100) + "%";

        if (json.success) {
          itemsDiv.innerHTML += `<div class="progress-item ok">✅ ${file.name}</div>`;
        } else {
          itemsDiv.innerHTML += `<div class="progress-item err">❌ ${file.name}: ${json.message}</div>`;
        }
      } catch (err) {
        done++;
        bar.style.width = (done / total * 100) + "%";
        itemsDiv.innerHTML += `<div class="progress-item err">❌ ${file.name}: ${err.message}</div>`;
      }
    }

    label.textContent = `อัปโหลดเสร็จแล้ว ${done}/${total} ไฟล์`;
    showToast(`✅ อัปโหลด ${done} ไฟล์ เข้าโฟลเดอร์ ${day} ${month} ${year} เรียบร้อย!`);

    // Reset
    setTimeout(() => {
      files = [];
      renderChips();
      checkReady();
      wrap.classList.remove("show");
    }, 4000);
  }

  // === UTILS ===
  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        // Strip data URL prefix, keep only base64 string
        const base64 = reader.result.split(",")[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg, err = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast" + (err ? " error" : "") + " show";
    setTimeout(() => t.className = "toast", 4000);
  }
</script>
</body>
</html>
